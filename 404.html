<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없음 — 셀프밸런스 랩</title>
<meta name="theme-color" content="#0c1230" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf2ff" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Inter", sans-serif;
    background: var(--bg, #edf2ff); color: var(--fg, #0c1230);
    text-align: center; padding: 24px;
  }
  .card { max-width: 520px; padding: 32px 28px; border-radius: 16px;
    background: rgba(255,255,255,.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0c1230; color: #e8eef5; }
    .card { background: rgba(20,26,52,.6); border-color: rgba(255,255,255,.08); }
  }
  h1 { margin: 0 0 12px; font-size: 28px; font-weight: 700; }
  p { margin: 0 0 24px; opacity: .85; line-height: 1.55; }
  a {
    display: inline-block; padding: 12px 22px; border-radius: 12px;
    background: #3d5a8f; color: #fff; text-decoration: none; font-weight: 600;
  }
  a:hover { background: #4a6aaa; }
  .num { font-size: 72px; line-height: 1; opacity: .3; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="num">404</div>
    <h1>페이지를 찾을 수 없음</h1>
    <p>요청하신 페이지가 존재하지 않거나 이동되었어요. 메인 랩으로 돌아가 회로를 이어서 만들어 보세요.</p>
    <a href="./">셀프밸런스 랩 열기</a>
  </div>
</body>
</html>
